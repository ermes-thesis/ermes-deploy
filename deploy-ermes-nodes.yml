- name: Deploy Ermes Nodes
  hosts: nodes
  become: true
  tasks:
    - name: Install Redis
      ansible.builtin.include_tasks: tasks/install_redis.yml
      when: not (skip_install | bool)

    # noqa no-changed-when
    - name: Flush Redis database (optional)
      ansible.builtin.command: redis-cli -a "{{ redis_password }}" FLUSHALL
      when: flush | bool
      notify: Restart Ermes Node

    # noqa no-changed-when
    - name: Drop Redis index (optional)
      ansible.builtin.command: redis-cli -a "{{ redis_password }}" FT.DROPINDEX metadata_index
      when: flush | bool
      notify: Restart Ermes Node

    - name: Ensure directory exists {{ common.logger.output.logDir }}
      ansible.builtin.file:
        path: "{{ common.logger.output.logDir }}"
        state: directory
        mode: '0755'
      when: not (skip_install | bool)

    - name: Stop Ermes Node to clear logs
      ansible.builtin.systemd:
        name: ermes-node
        state: stopped
      when: flush | bool

    - name: Get list of log files
      ansible.builtin.find:
        paths: "{{ common.logger.output.logDir }}"
        patterns: general-*
      register: result
      when: flush | bool

    - name: Delete old log files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ result.files }}"
      when: flush | bool
      notify: Restart Ermes Node

    - name: Clear last log files
      ansible.builtin.copy:
        content: ""
        dest: "{{ item }}"
        mode: '0755'
      loop: "{{ log_files }}"
      when: flush | bool
      notify: Restart Ermes Node

    - name: Write Redis configuration
      ansible.builtin.template:
        src: redis.conf.j2
        dest: /etc/redis/redis.conf
        owner: root
        group: root
        mode: '0644'
      when: not (skip_install | bool)
      notify: Restart redis

    - name: Install WasmEdge
      ansible.builtin.include_tasks: "tasks/install_wasmedge.yml"
      when: not (skip_install | bool)

    - name: Copy Ermes Node archive
      ansible.builtin.copy:
        src: "{{ bin_path }}.tar.xz"
        dest: /tmp/ermes-node.tar.xz
        mode: '0644'
      register: copy_result

    - name: Extract Ermes Node binary
      ansible.builtin.unarchive:
        src: /tmp/ermes-node.tar.xz
        dest: /usr/local/bin/
        remote_src: true
        mode: '0755'
      # noqa no-handler
      when: copy_result.changed
      notify: Restart Ermes Node

    - name: Ensure /etc/ermes-node/ directory exists
      ansible.builtin.file:
        path: /etc/ermes-node/
        state: directory
        mode: '0755'
      when: not (skip_install | bool)

    - name: Copy group token public key
      ansible.builtin.copy:
        src: ../ermes-generic-node/keys/public.pem
        dest: "{{ common.groupTokenPublicKeyPath }}"
        mode: '0755'
      notify: Restart Ermes Node
      when: not (skip_install | bool)

    - name: Copy Ermes Node config
      ansible.builtin.template:
        src: templates/node.conf.j2
        dest: /etc/ermes-node/config.yaml
        mode: '0644'
      notify: Restart Ermes Node

    - name: Create Ermes Node systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/ermes-node.service
        content: |
          [Unit]
          Description=Ermes Node
          After=network.target redis-server.service
          Requires=redis-server.service

          [Service]
          ExecStart=/usr/local/bin/ermes-node /etc/ermes-node/config.yaml
          Restart=always
          User=root
          Group=root

          StandardError=append:/var/log/ermes-node/ermes-node.err.log

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      when: not (skip_install | bool)

    - name: Enable and start Ermes Node
      ansible.builtin.systemd:
        name: ermes-node
        state: started
        enabled: true
        daemon_reload: true
      when: not (skip_install | bool)

  handlers:
    - name: Restart redis
      ansible.builtin.service:
        name: redis-server
        state: restarted

    - name: Restart Ermes Node
      ansible.builtin.systemd:
        name: ermes-node
        state: restarted
        daemon_reload: true

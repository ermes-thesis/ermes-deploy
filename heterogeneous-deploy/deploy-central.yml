---
- name: Deploy containerized Ermes central nodes
  hosts: cloud_nodes
  vars_files:
    - group_vars/all.yml
  vars:
    central_compose_dir: "{{ ansible_env.HOME }}/ermes-central-heterogeneous"
    central_install_dir: "{{ central_compose_dir }}/bin"
    central_config_dir: "{{ central_compose_dir }}/config"
    central_log_dir: "{{ central_compose_dir }}/logs"
    function_registry_binary: "{{ playbook_dir }}/../../ermes-function-registry/ermes-function-registry"
    central_repo_binary: "{{ playbook_dir }}/../../ermes-central-repo/ermes-central-repo"
    central_repo_private_key: "{{ playbook_dir }}/../../ermes-central-repo/keys/private.pem"
    central_redis_port: 6380
    central_minio_port: 9091
    central_minio_console_port: 9092
    auth_function_wasm: "{{ playbook_dir }}/../../ermes-central-repo/integration_test/authFunction@1.0.0.wasm"
    auth_function_script: "{{ playbook_dir }}/register-auth-function.sh"
    minio_bucket_script: "{{ playbook_dir }}/initialize-minio-buckets.py"
    central_dev_secret: "dev_secret"
  tasks:
    - name: Check host WasmEdge runtime library
      ansible.builtin.stat:
        path: "{{ wasmedge_host_library }}"
      register: wasmedge_library

    - name: Require host WasmEdge runtime library
      ansible.builtin.assert:
        that:
          - wasmedge_library.stat.exists
          - wasmedge_library.stat.isreg
        fail_msg: >-
          WasmEdge runtime library {{ wasmedge_host_library }} is missing on
          {{ inventory_hostname }}. Install WasmEdge on the host or override
          wasmedge_host_library with the architecture-specific library path.

    - name: Check central node artifacts
      ansible.builtin.stat:
        path: "{{ item.path }}"
      delegate_to: localhost
      become: false
      loop:
        - name: Function registry binary
          path: "{{ function_registry_binary }}"
        - name: Central repo binary
          path: "{{ central_repo_binary }}"
        - name: Central repo private key
          path: "{{ central_repo_private_key }}"
        - name: Authentication function
          path: "{{ auth_function_wasm }}"
        - name: Authentication function registration script
          path: "{{ auth_function_script }}"
        - name: MinIO bucket initialization script
          path: "{{ minio_bucket_script }}"
      register: central_artifacts

    - name: Require central node artifacts
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: >-
          {{ item.item.name }} is missing at {{ item.item.path }}.
          Build or provide the artifact before deploying the central nodes.
      loop: "{{ central_artifacts.results }}"

    - name: Create central deployment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ central_compose_dir }}"
        - "{{ central_install_dir }}"
        - "{{ central_config_dir }}"
        - "{{ central_log_dir }}"
        - "{{ central_log_dir }}/function-registry"
        - "{{ central_log_dir }}/central-repo"

    - name: Copy central Compose file
      ansible.builtin.template:
        src: central-compose.yml.j2
        dest: "{{ central_compose_dir }}/compose.yml"
        mode: "0644"

    - name: Copy Function registry executable
      ansible.builtin.copy:
        src: "{{ function_registry_binary }}"
        dest: "{{ central_install_dir }}/ermes-function-registry"
        mode: "0755"

    - name: Copy Function registry configuration
      ansible.builtin.copy:
        src: ../files/fr-config.yaml
        dest: "{{ central_config_dir }}/fr-config.yaml"
        mode: "0644"

    - name: Copy Central repo executable
      ansible.builtin.copy:
        src: "{{ central_repo_binary }}"
        dest: "{{ central_install_dir }}/ermes-central-repo"
        mode: "0755"

    - name: Copy Central repo configuration
      ansible.builtin.copy:
        src: ../files/cr-config.yaml
        dest: "{{ central_config_dir }}/cr-config.yaml"
        mode: "0644"

    - name: Copy Central repo private key
      ansible.builtin.copy:
        src: "{{ central_repo_private_key }}"
        dest: "{{ central_config_dir }}/private.pem"
        mode: "0600"

    - name: Copy authentication function
      ansible.builtin.copy:
        src: "{{ auth_function_wasm }}"
        dest: "{{ central_install_dir }}/authFunction@1.0.0.wasm"
        mode: "0644"

    - name: Copy authentication function registration script
      ansible.builtin.copy:
        src: "{{ auth_function_script }}"
        dest: "{{ central_install_dir }}/register-auth-function.sh"
        mode: "0755"

    - name: Copy MinIO bucket initialization script
      ansible.builtin.copy:
        src: "{{ minio_bucket_script }}"
        dest: "{{ central_install_dir }}/initialize-minio-buckets.py"
        mode: "0755"

    - name: Start central services
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ central_compose_dir }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Initialize central MinIO buckets
      ansible.builtin.command:
        argv:
          - python3
          - "{{ central_install_dir }}/initialize-minio-buckets.py"
          - "http://127.0.0.1:{{ central_minio_port }}"
          - "{{ minio_root_user }}"
          - "{{ minio_root_password }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Register and activate authentication function
      ansible.builtin.command:
        argv:
          - "{{ central_install_dir }}/register-auth-function.sh"
          - "{{ central_install_dir }}/authFunction@1.0.0.wasm"
          - "http://127.0.0.1:8080"
          - "http://127.0.0.1:8081"
          - "{{ central_dev_secret }}"
      changed_when: true
      when: not ansible_check_mode

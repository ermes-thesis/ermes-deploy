---
- name: Apply or reset cloud-edge network latency
  hosts: nodes
  gather_facts: true
  vars:
    interface: "{{ ansible_facts.default_ipv4.interface }}"
    latency_command: tc-net
    latency_action: apply
    rtt_ms: 30
    one_way_delay_ms: "{{ (rtt_ms | int / 2) | int }}"

  pre_tasks:
    - name: Validate latency settings
      ansible.builtin.assert:
        that:
          - latency_action in ['apply', 'reset']
          - latency_command | length > 0
        fail_msg: >-
          latency_action must be 'apply' or 'reset' and latency_command must
          not be empty

    - name: Check latency command availability
      ansible.builtin.shell:
        cmd: "command -v {{ latency_command | quote }}"
      register: latency_command_check
      changed_when: false
      failed_when: false

  tasks:
    - name: Require latency command
      ansible.builtin.assert:
        that:
          - latency_command_check.rc == 0
        fail_msg: >-
          Latency command '{{ latency_command }}' is not available on
          {{ inventory_hostname }} for user {{ ansible_user_id }} with PATH
          '{{ ansible_env.PATH | default("unset") }}'. Use an absolute path
          or override latency_command.

    - name: Apply symmetric cloud-edge delay
      ansible.builtin.command:
        argv:
          - "{{ latency_command }}"
          - qdisc
          - replace
          - dev
          - "{{ interface }}"
          - root
          - netem
          - delay
          - "{{ one_way_delay_ms }}ms"
      when: latency_action == 'apply'

    - name: Reset cloud-edge delay
      ansible.builtin.command:
        argv:
          - "{{ latency_command }}"
          - qdisc
          - del
          - dev
          - "{{ interface }}"
          - root
      register: reset_result
      failed_when:
        - reset_result.rc != 0
        - "'No such file or directory' not in reset_result.stderr"
        - "'Cannot find device' not in reset_result.stderr"
      changed_when: reset_result.rc == 0
      when: latency_action == 'reset'

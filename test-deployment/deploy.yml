---
- name: Deploy isolated Ermes heterogeneous test
  hosts: nodes
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/nodes.yml
    - group_vars/all.yml
  vars:
    docker_compose_dir: "{{ ansible_env.HOME }}/ermes-test"
    ermes_install_dir: "{{ docker_compose_dir }}/bin"
    ermes_config_dir: "{{ docker_compose_dir }}/config"
    ermes_log_dir: "{{ docker_compose_dir }}/logs"
    ermes_binary: "{{ ermes_binary_amd64 if 'cloud_nodes' in group_names else ermes_binary_arm64 }}"
  tasks:
    - name: Create deployment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ docker_compose_dir }}"
        - "{{ ermes_install_dir }}"
        - "{{ ermes_config_dir }}"
        - "{{ ermes_log_dir }}"

    - name: Check host WasmEdge runtime library
      ansible.builtin.stat:
        path: "{{ wasmedge_host_library }}"
      register: wasmedge_library

    - name: Require host WasmEdge runtime library
      ansible.builtin.assert:
        that:
          - wasmedge_library.stat.exists
          - wasmedge_library.stat.isreg
        fail_msg: >-
          WasmEdge runtime library {{ wasmedge_host_library }} is missing on
          {{ inventory_hostname }}. Install WasmEdge on the host or override
          wasmedge_host_library with the architecture-specific library path.

    - name: Copy dependency compose file
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ docker_compose_dir }}/compose.yml"
        mode: "0644"

    - name: Copy Ermes node executable
      ansible.builtin.copy:
        src: "{{ ermes_binary }}"
        dest: "{{ ermes_install_dir }}/ermes-node"
        mode: "0755"

    - name: Copy group token public key
      ansible.builtin.copy:
        src: "{{ ermes_public_key }}"
        dest: "{{ ermes_config_dir }}/token-public-key.pem"
        mode: "0644"

    - name: Validate Ermes topology address
      ansible.builtin.assert:
        that:
          - node_address in (nodes | map(attribute="address") | list)
        fail_msg: >-
          No topology entry matches node_address={{ node_address }} for
          {{ inventory_hostname }}. Set node_address in inventory.ini.

    - name: Render Ermes node configuration
      ansible.builtin.template:
        src: node.conf.j2
        dest: "{{ ermes_config_dir }}/config.yaml"
        mode: "0644"

    - name: Start containerized dependencies and Ermes node
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ docker_compose_dir }}"
      changed_when: false
      when: not ansible_check_mode

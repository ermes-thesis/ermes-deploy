---
ermes_binary_amd64: "{{ playbook_dir }}/../../ermes-generic-node/main/main"
ermes_binary_arm64: "{{ playbook_dir }}/../../ermes-compilation/aarch64/main-aarch64"
ermes_public_key: "{{ playbook_dir }}/../../ermes-generic-node/keys/public.pem"
minio_root_user: "minioadmin"
minio_root_password: "minioadmin"
minio_enabled: true
minio_image: "minio-local:legacy"
redis_image: "redis:8.4"
wasmedge_host_library: "/usr/local/lib/libwasmedge.so.0.1.0"

nodes:
  - name: "SOLA4"
    domain: "SOLA4"
    address: 10.79.10.134
    is_cloud: true
    latency_up: 0
  - name: "PI"
    domain: "SOLA4/PI"
    address: 10.79.10.243
    is_cloud: false
    latency_up: 0

common:
  stateful: true
  isCentralStorage: false
  redis:
    port: 6381
  migrationManager:
    weakPolicy: ALWAYSCOPYPOLICY
    strongPolicy: ERMESPOLICY

- hosts: central_nodes
  become: yes
  vars:
    minio_root_user: "minioadmin"
    minio_root_password: "minioadmin"
    minio_buckets:
      - name: functions
        policy: private
      - name: queries
        policy: private
  tasks:
    - name: Install minio
      include_role:
        name: ricsanfre.minio

    - name: Copy Function registry binary
      copy:
        src: ../ermes-function-registry/ermes-function-registry
        dest: /usr/local/bin/ermes-function-registry
        mode: '0755'

    - name: Ensure /etc/function-registry directory exists
      file: 
        path: /etc/function-registry
        state: directory
        mode: '0755'

    - name: Copy Function registry config
      copy:
        src: function-registry/.env
        dest: /etc/function-registry/env
        mode: '0644'

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/ermes-function-registry.service
        content: |
          [Unit]
          Description=Ermes Function Registry
          After=network.target minio.service
          Requires=minio.service

          [Service]
          ExecStart=/usr/local/bin/ermes-function-registry
          EnvironmentFile=/etc/function-registry/env
          Restart=always
          User=root
          Group=root

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Function Registry
      systemd:
        name: ermes-function-registry
        state: started
        enabled: yes
        daemon_reload: yes
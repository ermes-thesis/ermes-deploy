- hosts: central_nodes
  become: yes
  vars:
    minio_root_user: "minioadmin"
    minio_root_password: "minioadmin"
    minio_buckets:
      - name: functions
        policy: private
      - name: queries
        policy: private
  tasks:
    - name: Install minio
      include_role:
        name: ricsanfre.minio

    - name: Copy Function registry binary
      copy:
        src: ../ermes-function-registry/ermes-function-registry
        dest: /usr/local/bin/ermes-function-registry
        mode: '0755'
      notify: Restart function registry

    - name: Ensure /etc/ermes-fr/ directory exists
      file: 
        path: /etc/ermes-fr/
        state: directory
        mode: '0755'

    - name: Copy Function registry config
      copy:
        src: function-registry/config.yaml
        dest: /etc/ermes-fr/config.yaml
        mode: '0644'
      notify: Restart function registry

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/ermes-function-registry.service
        content: |
          [Unit]
          Description=Ermes Function Registry
          After=network.target minio.service
          Requires=minio.service

          [Service]
          ExecStart=/usr/local/bin/ermes-function-registry
          Restart=always
          User=root
          Group=root

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Function Registry
      systemd:
        name: ermes-function-registry
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Install Redis
      include_role:
        name: geerlingguy.redis
      vars:
        redis_requirepass: "very-secure-password"

    - name: Get wasmedge install script
      get_url:
        url: https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh
        mode: 0755
        dest: /tmp

    - name: Install WasmEdge globally
      shell: ./install.sh -p /usr/local
      args:
        chdir: /tmp
        creates: "/usr/local/bin/wasmedge"

    - name: Copy Central repo binary
      copy:
        src: ../ermes-central-repo/ermes-central-repo
        dest: /usr/local/bin/ermes-central-repo
        mode: '0755'

    - name: Ensure /etc/ermes-cr directory exists
      file: 
        path: /etc/ermes-cr
        state: directory
        mode: '0755'

    - name: Copy Central repo config
      copy:
        src: central-repo/config.yaml
        dest: /etc/ermes-cr/config.yaml
        mode: '0644'
      notify: Restart central repo

    - name: Copy Central repo private key
      copy:
        src: ../ermes-central-repo/.devcontainer/private.pem
        dest: /etc/ermes-cr/private.pem
        mode: '0600'
      notify: Restart central repo

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/ermes-central-repo.service
        content: |
          [Unit]
          Description=Ermes Central Repo
          After=network.target redis-server.service
          Requires=redis-server.service

          [Service]
          ExecStart=/usr/local/bin/ermes-central-repo
          Restart=always
          User=root
          Group=root

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Central Repo
      systemd:
        name: ermes-central-repo
        state: started
        enabled: yes
        daemon_reload: yes

  handlers:
    - name: Restart central repo
      systemd:
        name: ermes-central-repo
        state: restarted
        daemon_reload: yes
    - name: Restart function registry
      systemd:
        name: ermes-function-registry
        state: restarted
        daemon_reload: yes

common:
  port: 12345
  secret: "ermes-secret"  
  clientSecret: "client-secret"  
  migrationManager:
    leaderThreshold: 5
    followerThreshold: 5
    viewSize: 5
    idleTimeoutMs: 1000
    gravityConstant: 9.81
    knownCollectionsDumpPath: /var/log/ermes-node/dump.ndjson
    knownCollectionsDumpInterval: 30s
  lru:
    size: 10000
    safeLevel: 0.8  
  redis:
    address: "localhost"
    port: 6379
    db: 0
    password: very-secure-password
    protocol: 2 
  functionsCache:
    binaryCache:
      size: 100
      ttl: 0s
      binDir: "./functionCache"
    templateCache:
      size: 100
      ttl: 0s
    latestCache:
      size: 100
      ttl: 3600s
    functionRegistry:
      address: "10.10.101.58"
      port: 8080
  scheduler:
    groupTokenProviderAddress: "10.10.101.58"
    groupTokenProviderPort: 8081
    wasmRuntime: "wasmtime" 
  groupTokenPublicKeyPath: "/etc/ermes-node/token-public-key.pem"
  logger:
    level: 0
    output:
      logDir: /var/log/ermes-node
      logFileName: general.log
    stdoutEnabled: false
    addSource: true
    colored: true
    rolling: true
    muted: false

log_files:
  - /var/log/ermes-node/general.log
  - /var/log/ermes-node/dump.ndjson
  - /var/log/ermes-node/ermes-node.err.log
  # - /var/log/ermes-node/ermes-node.out.log
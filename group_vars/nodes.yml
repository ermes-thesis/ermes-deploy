common:
  port: 12345
  secret: "ermes-secret"  
  clientSecret: "client-secret"  
  migrationManager:
    leaderThreshold: 5
    followerThreshold: 5
    viewSize: 5
    idleTimeoutMs: 30000
    gravityConstant: 9.81 
  lru:
    size: 10000
    safeLevel: 0.8  
  redis:
    address: "localhost"
    port: 6379
    db: 0
    password: very-secure-password
    protocol: 2 
  functionsCache:
    binaryCache:
      size: 100
      ttl: 0s
      binDir: "./functionCache"
    templateCache:
      size: 100
      ttl: 0s
    latestCache:
      size: 100
      ttl: 3600s
    functionRegistry:
      address: "10.10.101.58"
      port: 8080
  scheduler:
    groupTokenProviderAddress: "10.10.101.58"
    groupTokenProviderPort: 8081
    wasmRuntime: "wasmtime" 
  groupTokenPublicKeyPath: "/etc/ermes-node/token-public-key.pem"

log_files:
  - /genLogs/general.log
  - /genLogs/ermes-node.err.log
  - /genLogs/ermes-node.out.log
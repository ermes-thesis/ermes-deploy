---
# 1. Installazione pacchetti base
- name: Ensure lsb-release is installed
  ansible.builtin.apt:
    name: lsb-release
    state: present
    update_cache: true

- name: Add Redis APT key
  ansible.builtin.apt_key:
    url: https://packages.redis.io/gpg
    keyring: /usr/share/keyrings/redis-archive-keyring.gpg
    state: present

- name: Add Redis repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb {{ ansible_lsb.codename }} main"
    filename: redis
    state: present

- name: Install Redis package
  ansible.builtin.apt:
    name: redis
    state: present
    update_cache: true

# 2. Disabilitazione del servizio default (quello creato da APT)
- name: Disable default redis-server service
  ansible.builtin.service:
    name: redis-server
    state: stopped
    enabled: false
  failed_when: false

# 3. Preparazione directory base
- name: Ensure Redis configuration directory exists
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    owner: redis
    group: redis
    mode: '0755'

# 4. Creazione Directory Dati
- name: Create data directories for each instance
  ansible.builtin.file:
    path: "/var/lib/redis/{{ redis_port }}"
    state: directory
    owner: redis
    group: redis
    mode: '0750'

# 5. Creazione File di Configurazione
- name: Create Redis configuration files
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "/etc/redis/redis-{{ redis_port }}.conf"
    owner: redis
    group: redis
    mode: '0640'
  notify: Restart redis

# 6. Creazione File di Servizio Systemd
- name: Create Systemd unit files
  ansible.builtin.template:
    src: redis-custom.service.j2
    dest: "/etc/systemd/system/redis-{{ redis_port }}.service"
    mode: '0644'
  notify: Reload Systemd

# 7. Avvio dei servizi
- name: Ensure Redis instances are started and enabled
  ansible.builtin.service:
    name: "redis-{{ redis_port }}"
    state: started
    enabled: true

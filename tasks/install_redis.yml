# tasks/install_redis.yml
- name: Ensure lsb-release is installed
  ansible.builtin.apt:
    name: lsb-release
    state: present
    update_cache: true

- name: Add Redis APT key
  ansible.builtin.apt_key:
    url: https://packages.redis.io/gpg
    keyring: /usr/share/keyrings/redis-archive-keyring.gpg
    state: present

- name: Add Redis repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb {{ ansible_lsb.codename }} main"
    filename: redis
    state: present

- name: Install Redis
  ansible.builtin.apt:
    name: redis
    state: present
    update_cache: true

- name: Flush Redis database (optional)
  ansible.builtin.command: redis-cli -a "{{ redis_password }}" FLUSHALL
  when: flush_redis | bool
